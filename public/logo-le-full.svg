<svg width="550" height="80" viewBox="0 0 550 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- No Background (Transparent) -->
  
  <!-- L&E Button (Left) -->
  <g transform="translate(10, 10)">
    <defs>
      <linearGradient id="blueGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0056b3" />
        <stop offset="100%" stop-color="#004494" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.3)"/>
      </filter>
    </defs>
    <rect width="130" height="60" rx="16" fill="url(#blueGradient)" stroke="#cccccc" stroke-width="3" filter="url(#shadow)"/>
    <text x="65" y="32" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="900" font-size="40" style="letter-spacing: 0px;">L&amp;E</text>
  </g>
  
  <!-- Divider -->
  <line x1="155" y1="10" x2="155" y2="70" stroke="#cccccc" stroke-width="2"/>
  
  <!-- Text (Right) -->
  <g transform="translate(165, 0)">
    <text x="0" y="32" fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="24" letter-spacing="0.5">LIGHTING AND EQUIPMENT</text>
    <text x="0" y="58" fill="white" font-family="Arial, sans-serif" font-weight="normal" font-size="14" letter-spacing="3">COMPANY LIMITED</text>
  </g>
</svg>
